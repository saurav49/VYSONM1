name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('server/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: server
        run: bun run prisma:generate

      - name: Run lint
        working-directory: server
        run: bun run lint
        continue-on-error: true

      - name: Run test coverage
        working-directory: server
        run: bun run test:coverage

      - name: Build
        working-directory: server
        run: bun run build

      - name: Deploy to Railway
        if: success() && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          bun x @railway/cli up ./server --path-as-root --ci \
            --project e1a98429-3abc-49f0-8792-d7661930968e \
            --environment production \
            --service 8d038ed5-e911-41c4-8cef-22af66465d0b
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord if CI fails
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "{\"content\":\"❌ CI failed for ${GITHUB_REPOSITORY}\\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL"
