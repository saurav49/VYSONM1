name: Build

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('server/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: server

      - name: Generate Prisma client
        run: bun run prisma:generate
        working-directory: server

      - name: Run lint
        run: bun run lint
        continue-on-error: true
        working-directory: server

      - name: Run test coverage
        run: bun run test:coverage
        working-directory: server

      - name: Run Build
        run: bun run build
        working-directory: server

      - name: Deploy to railway
        if: success() && github.ref == 'refs/heads/main'
        working-directory: .
        run: bun x @railway/cli up ./server --path-as-root --ci --project e1a98429-3abc-49f0-8792-d7661930968e --environment production --service 8d038ed5-e911-41c4-8cef-22af66465d0b
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
